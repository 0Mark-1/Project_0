<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Market Data - Combined from CSV Files</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .typeahead { position: relative; width: 400px; }
    input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      border: 1px solid #ccc;
      background: #fff;
      max-height: 220px;
      overflow-y: auto;
      z-index: 10;
    }
    .suggestion { padding: 6px 8px; cursor: pointer; }
    .suggestion:hover, .suggestion.active { background: #f0f0f0; }
    #plot { width: 100%; max-width: 1200px; height: 700px; }
    label { display:block; margin-bottom: 6px; font-weight:600; }
    .controls { margin-bottom: 12px; }
    .status { margin-top: 10px; font-style: italic; color: #666; }
  </style>
</head>
<body>
  <h1>Market Data Explorer (Combined CSVs)</h1>
  
  <div class="controls">
    <label for="type-input">Select type_name</label>
    <div class="typeahead">
      <input id="type-input" type="text" placeholder="Search type_name..." autocomplete="off" />
      <div id="suggestions" class="suggestions" style="display:none;"></div>
    </div>
  </div>

  <div id="status" class="status"></div>
  <div id="plot"></div>

<script>
// Configuration - change these as needed
const OWNER = '0Mark-1';
const REPO = 'Project_0';
const BRANCH = 'main'; // or 'master'

let rawRows = []; // Combined data from all CSVs
let uniqueTypes = [];

function parseCSV(text) {
  const rows = [];
  const lines = text.split(/\r?\n/);
  if (lines.length === 0) return rows;
  const headers = parseCSVLine(lines[0]);
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const cols = parseCSVLine(lines[i]);
    const obj = {};
    for (let j = 0; j < headers.length; j++) {
      obj[headers[j]] = cols[j] !== undefined ? cols[j] : "";
    }
    rows.push(obj);
  }
  return rows;
}

function parseCSVLine(line) {
  const res = [];
  let cur = "", inQuotes = false;
  for (let i=0; i<line.length; i++){
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"') {
        if (line[i+1] === '"') { cur += '"'; i++; } else { inQuotes = false; }
      } else cur += ch;
    } else {
      if (ch === ',') { res.push(cur); cur = ""; }
      else if (ch === '"') { inQuotes = true; }
      else cur += ch;
    }
  }
  res.push(cur);
  return res;
}

function toDate(s) {
  if (!s) return null;
  let d = new Date(s);
  if (!isNaN(d)) return d;
  const parts = s.split(/[\/\-\.]/);
  if (parts.length === 3) {
    if (parts[0].length === 4) d = new Date(parts[0], Number(parts[1]) - 1, parts[2]);
    else d = new Date(parts[2], Number(parts[1]) - 1, parts[0]);
    if (!isNaN(d)) return d;
  }
  return null;
}

function numberOrNull(s) {
  if (s === null || s === undefined || s === "") return null;
  const n = Number(s);
  return isNaN(n) ? null : n;
}

// Fetch list of CSV files using GitHub Git Trees API (recursive)
async function getCSVFiles() {
  const url = `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`GitHub API error: ${resp.status} ${resp.statusText}`);
  const data = await resp.json();
  
  if (!data.tree) throw new Error("No tree data returned");
  
  return data.tree
    .filter(item => item.type === 'blob' && item.path.toLowerCase().endsWith('.csv'))
    .map(item => ({
      path: item.path,
      rawUrl: `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${item.path}`
    }));
}

// Load and combine data from all CSVs
async function loadAllData() {
  const statusEl = document.getElementById('status');
  statusEl.textContent = 'Fetching list of CSV files...';
  
  const csvFiles = await getCSVFiles();
  statusEl.textContent = `Found ${csvFiles.length} CSV file(s). Loading data...`;
  
  rawRows = [];
  
  for (let i = 0; i < csvFiles.length; i++) {
    const file = csvFiles[i];
    statusEl.textContent = `Loading ${i+1}/${csvFiles.length}: ${file.path}`;
    
    try {
      const resp = await fetch(file.rawUrl);
      if (!resp.ok) continue;
      const txt = await resp.text();
      const rows = parseCSV(txt);
      
      const normalized = rows.map(r => ({
        type_name: (r.type_name ?? r.type ?? r.Type ?? "").trim(),
        price_in_plex: numberOrNull(r.price_in_plex ?? r.price ?? r.Price ?? r.price_in_isk),
        date: toDate(r.date ?? r.DATE ?? r.timestamp ?? r.time ?? r.date_time)
      })).filter(r => r.type_name && r.price_in_plex !== null && r.date !== null);
      
      rawRows = rawRows.concat(normalized);
    } catch (e) {
      console.warn(`Failed to load ${file.path}`, e);
    }
  }
  
  // Get unique types
  const set = new Set(rawRows.map(r => r.type_name));
  uniqueTypes = Array.from(set).sort((a,b) => a.localeCompare(b));
  
  statusEl.textContent = `Loaded ${rawRows.length} records from ${csvFiles.length} CSV files.`;
}

// Typeahead and plotting (same as original with minor improvements)
function initTypeahead() {
  const input = document.getElementById('type-input');
  const sugg = document.getElementById('suggestions');

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) {
      renderSuggestions(uniqueTypes.slice(0, 50));
      return;
    }
    const matches = uniqueTypes.filter(t => t.toLowerCase().includes(q)).slice(0, 50);
    renderSuggestions(matches);
  });

  input.addEventListener('keydown', (ev) => {
    const items = Array.from(sugg.querySelectorAll('.suggestion'));
    const active = sugg.querySelector('.suggestion.active');
    let idx = items.indexOf(active);
    
    if (ev.key === 'ArrowDown') {
      ev.preventDefault();
      if (idx < items.length - 1 || idx === -1) {
        if (active) active.classList.remove('active');
        items[Math.max(0, idx + 1)].classList.add('active');
      }
    } else if (ev.key === 'ArrowUp') {
      ev.preventDefault();
      if (idx > 0) {
        active.classList.remove('active');
        items[idx - 1].classList.add('active');
      }
    } else if (ev.key === 'Enter') {
      ev.preventDefault();
      const sel = sugg.querySelector('.suggestion.active') || items[0];
      if (sel) selectType(sel.textContent);
    }
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.typeahead')) sugg.style.display = 'none';
  });

  renderSuggestions(uniqueTypes.slice(0, 50));
}

function renderSuggestions(list) {
  const sugg = document.getElementById('suggestions');
  sugg.innerHTML = '';
  if (!list || list.length === 0) {
    sugg.style.display = 'none';
    return;
  }
  list.forEach(item => {
    const div = document.createElement('div');
    div.className = 'suggestion';
    div.textContent = item;
    div.addEventListener('click', () => selectType(item));
    sugg.appendChild(div);
  });
  sugg.style.display = 'block';
}

function selectType(typeName) {
  document.getElementById('type-input').value = typeName;
  document.getElementById('suggestions').style.display = 'none';
  updatePlotForType(typeName);
}

function updatePlotForType(typeName) {
  const filtered = rawRows
    .filter(r => r.type_name === typeName)
    .sort((a, b) => a.date - b.date);

  if (filtered.length === 0) {
    Plotly.purge('plot');
    document.getElementById('plot').innerHTML = "<p>No data for selected type.</p>";
    return;
  }

  const x = filtered.map(r => r.date.toISOString().split('T')[0]); // cleaner date
  const y = filtered.map(r => r.price_in_plex);

  const trace = {
    x, y,
    mode: 'lines+markers',
    type: 'scatter',
    marker: { size: 5 },
    line: { width: 2 },
    name: typeName
  };

  const layout = {
    title: `${typeName} — Combined price_in_plex over time`,
    xaxis: { title: 'Date', type: 'date' },
    yaxis: { title: 'price_in_plex' },
    margin: { t: 80, l: 70, r: 30, b: 70 },
    hovermode: 'closest'
  };

  Plotly.newPlot('plot', [trace], layout, { responsive: true });
}

(async function main() {
  try {
    await loadAllData();
    if (uniqueTypes.length === 0) {
      document.getElementById('status').innerHTML += '<br><strong style="color:red;">No valid market data found.</strong>';
      return;
    }
    initTypeahead();
    selectType(uniqueTypes[0]); // auto-select first
  } catch (err) {
    console.error(err);
    document.getElementById('status').innerHTML = `<strong style="color:red;">Error: ${err.message}</strong>`;
  }
})();
</script>
</body>
</html>
