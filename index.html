<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Price in Plex over Time</title>
  <script src="https://cdn.plot.ly/plotly-2.25.2.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .typeahead { position: relative; width: 400px; }
    input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      border: 1px solid #ccc;
      background: #fff;
      max-height: 220px;
      overflow-y: auto;
      z-index: 10;
    }
    .suggestion { padding: 6px 8px; cursor: pointer; }
    .suggestion:hover, .suggestion.active { background: #f0f0f0; }
    #plot { width: 100%; max-width: 1000px; height: 600px; }
    label { display:block; margin-bottom: 6px; font-weight:600; }
    .controls { margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="controls">
    <label for="type-input">Select type_name</label>
    <div class="typeahead">
      <input id="type-input" type="text" placeholder="Search type_name..." autocomplete="off" />
      <div id="suggestions" class="suggestions" style="display:none;"></div>
    </div>
  </div>

  <div id="plot"></div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/0Mark-1/Project_0/main/book2_filtered_from_2018.csv";

let rawRows = []; // array of objects from CSV
let uniqueTypes = [];

function parseCSV(text) {
  // simple CSV parser that handles quoted fields
  const rows = [];
  const lines = text.split(/\r?\n/);
  if (lines.length === 0) return rows;
  const headers = parseCSVLine(lines[0]);
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const cols = parseCSVLine(lines[i]);
    const obj = {};
    for (let j = 0; j < headers.length; j++) {
      obj[headers[j]] = cols[j] !== undefined ? cols[j] : "";
    }
    rows.push(obj);
  }
  return rows;
}

function parseCSVLine(line) {
  const res = [];
  let cur = "", inQuotes = false;
  for (let i=0;i<line.length;i++){
    const ch=line[i];
    if (inQuotes) {
      if (ch === '"') {
        if (line[i+1] === '"') { cur += '"'; i++; } else { inQuotes = false; }
      } else cur += ch;
    } else {
      if (ch === ',') { res.push(cur); cur = ""; }
      else if (ch === '"') { inQuotes = true; }
      else cur += ch;
    }
  }
  res.push(cur);
  return res;
}

function toDate(s) {
  // try common date formats; fallback to new Date()
  if (!s) return null;
  // try ISO first
  let d = new Date(s);
  if (!isNaN(d)) return d;
  // try yyyy-mm-dd or dd/mm/yyyy heuristics
  const parts = s.split(/[\/\-\.]/);
  if (parts.length === 3) {
    if (parts[0].length === 4) d = new Date(parts[0], Number(parts[1]) - 1, parts[2]);
    else d = new Date(parts[2], Number(parts[1]) - 1, parts[0]);
    if (!isNaN(d)) return d;
  }
  return null;
}

function numberOrNull(s) {
  if (s === null || s === undefined || s === "") return null;
  const n = Number(s);
  return isNaN(n) ? null : n;
}

async function loadData() {
  const resp = await fetch(CSV_URL);
  if (!resp.ok) throw new Error("Failed to fetch CSV");
  const txt = await resp.text();
  const rows = parseCSV(txt);
  // Normalize columns: expecting at least type_name, price_in_plex, date (or timestamp)
  rawRows = rows.map(r => {
    return {
      type_name: r.type_name ?? r.type ?? r.Type ?? "",
      price_in_plex: numberOrNull(r.price_in_plex ?? r.price ?? r.Price ?? r.price_in_isk),
      date: toDate(r.date ?? r.DATE ?? r.timestamp ?? r.time ?? r.date_time)
    };
  }).filter(r => r.type_name && r.price_in_plex !== null && r.date !== null);

  // get unique types sorted
  const set = new Set(rawRows.map(r => r.type_name));
  uniqueTypes = Array.from(set).sort((a,b)=> a.localeCompare(b));
}

function initTypeahead() {
  const input = document.getElementById('type-input');
  const sugg = document.getElementById('suggestions');

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) {
      renderSuggestions(uniqueTypes.slice(0,50));
      return;
    }
    const matches = uniqueTypes.filter(t => t.toLowerCase().includes(q)).slice(0,50);
    renderSuggestions(matches);
  });

  input.addEventListener('keydown', (ev) => {
    const items = Array.from(sugg.querySelectorAll('.suggestion'));
    const active = sugg.querySelector('.suggestion.active');
    let idx = items.indexOf(active);
    if (ev.key === 'ArrowDown') {
      ev.preventDefault();
      if (idx < items.length - 1) {
        if (active) active.classList.remove('active');
        items[idx+1].classList.add('active');
      } else if (items.length) {
        if (active) active.classList.remove('active');
        items[0].classList.add('active');
      }
    } else if (ev.key === 'ArrowUp') {
      ev.preventDefault();
      if (idx > 0) {
        active.classList.remove('active');
        items[idx-1].classList.add('active');
      } else if (items.length) {
        if (active) active.classList.remove('active');
        items[items.length-1].classList.add('active');
      }
    } else if (ev.key === 'Enter') {
      ev.preventDefault();
      const sel = sugg.querySelector('.suggestion.active') || items[0];
      if (sel) selectType(sel.textContent);
    }
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.typeahead')) {
      sugg.style.display = 'none';
    }
  });

  // initial list
  renderSuggestions(uniqueTypes.slice(0,50));
}

function renderSuggestions(list) {
  const sugg = document.getElementById('suggestions');
  sugg.innerHTML = '';
  if (!list || list.length === 0) { sugg.style.display = 'none'; return; }
  list.forEach(item => {
    const div = document.createElement('div');
    div.className = 'suggestion';
    div.textContent = item;
    div.addEventListener('click', () => selectType(item));
    sugg.appendChild(div);
  });
  sugg.style.display = 'block';
}

function selectType(typeName) {
  document.getElementById('type-input').value = typeName;
  document.getElementById('suggestions').style.display = 'none';
  updatePlotForType(typeName);
}

function updatePlotForType(typeName) {
  const filtered = rawRows.filter(r => r.type_name === typeName).sort((a,b) => a.date - b.date);
  if (filtered.length === 0) {
    Plotly.purge('plot');
    document.getElementById('plot').innerHTML = "<p>No data for selected type.</p>";
    return;
  }
  const x = filtered.map(r => r.date.toISOString());
  const y = filtered.map(r => r.price_in_plex);

  const trace = {
    x, y,
    mode: 'lines+markers',
    type: 'scatter',
    marker: { size: 6 },
    line: { width: 2 },
    name: typeName
  };

  const layout = {
    title: `${typeName} — price_in_plex over time`,
    xaxis: { title: 'Date', type: 'date' },
    yaxis: { title: 'price_in_plex' },
    margin: { t: 50, l: 60, r: 20, b: 60 }
  };

  Plotly.newPlot('plot', [trace], layout, {responsive: true});
}

(async function main(){
  try {
    await loadData();
    initTypeahead();
    // auto-select first type if present
    if (uniqueTypes.length) selectType(uniqueTypes[0]);
  } catch (err) {
    document.getElementById('plot').innerHTML = "<pre>Error loading data: " + String(err) + "</pre>";
  }
})();
</script>
